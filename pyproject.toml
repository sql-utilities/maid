[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "maid"
version = "0.1.0"
description = "CLI utility to clean table data from empty rows, duplicates and error values"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
maid = "maid.cli:main"

[tool.setuptools.packages.find]
include = ["maid*"]
